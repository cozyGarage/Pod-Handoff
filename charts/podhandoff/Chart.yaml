apiVersion: v2
name: podhandoff
description: >-
  Readiness-gated Pod handoff for single-replica Kubernetes Deployments during
  announced node disruptions, without a standing second application replica.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.34.0-0"
keywords:
  - availability
  - spot
  - eviction
  - admission-webhook
  - node-drain
  - karpenter
  - cluster-autoscaler
home: https://github.com/cozyGarage/podhandoff
sources:
  - https://github.com/cozyGarage/podhandoff
icon: https://raw.githubusercontent.com/cozyGarage/podhandoff/main/docs/assets/podhandoff-mark.svg
maintainers:
  - name: cozyGarage
    url: https://github.com/cozyGarage
annotations:
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Seamless Upgrades
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/cozyGarage/podhandoff
    - name: How it works
      url: https://github.com/cozyGarage/podhandoff/blob/main/docs/how-it-works.md
    - name: Upgrade notes
      url: https://github.com/cozyGarage/podhandoff/blob/main/UPGRADING.md
    - name: Issues
      url: https://github.com/cozyGarage/podhandoff/issues
  artifacthub.io/images: |
    - name: podhandoff
      image: ghcr.io/cozyGarage/podhandoff:0.1.0
  artifacthub.io/crds: |
    - kind: PodHandoff
      version: v1alpha1
      name: podhandoffs.apps.podhandoff.io
      displayName: PodHandoff
      description: >-
        Protects a single-replica Deployment by bringing up a stand-in pod when
        its node is doomed and holding the eviction until the stand-in serves
        traffic.
  artifacthub.io/crdsExamples: |
    - apiVersion: apps.podhandoff.io/v1alpha1
      kind: PodHandoff
      metadata:
        name: tenant-worker
      spec:
        targetRef:
          kind: Deployment
          name: tenant-worker
        holdMode: always
        minSurgeTimeSeconds: 60
        readinessDeadlineSeconds: 600
  artifacthub.io/changes: |
    - kind: added
      description: Initial PodHandoff prerelease derived from Understudy v0.4.2 with ownership, deletion-cost, rollout and GitOps hardening
