apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: eviction-hold
  annotations:
    cert-manager.io/inject-ca-from: podhandoff-system/podhandoff-serving-cert
webhooks:
  - name: eviction-hold.podhandoff.io
    admissionReviewVersions:
      - v1
    sideEffects: NoneOnDryRun
    matchPolicy: Equivalent
    failurePolicy: Ignore
    timeoutSeconds: 2
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /observe-eviction
        port: 443
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods/eviction
        scope: Namespaced
