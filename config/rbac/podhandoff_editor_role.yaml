# This rule is not used by the project podhandoff itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.podhandoff.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: podhandoff
    app.kubernetes.io/managed-by: kustomize
  name: podhandoff-editor-role
rules:
- apiGroups:
  - apps.podhandoff.io
  resources:
  - podhandoffs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.podhandoff.io
  resources:
  - podhandoffs/status
  verbs:
  - get
