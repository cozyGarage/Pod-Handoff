apiVersion: v1
kind: Namespace
metadata:
  name: podhandoff-e2e-pilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: podhandoff-e2e-pilot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: podhandoff-e2e-canary
  template:
    metadata:
      labels:
        app: podhandoff-e2e-canary
    spec:
      nodeSelector:
        podhandoff.io/e2e-canary: "true"
      containers:
      - name: canary
        image: podhandoff-lab-canary:v0.0.1
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: podhandoff-e2e-pilot
spec:
  type: NodePort
  selector:
    app: podhandoff-e2e-canary
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
