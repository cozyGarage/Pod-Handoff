name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Build manager
        run: make build
      - name: Verify generated code is committed
        run: |
          make manifests generate
          git diff --exit-code || (echo "::error::generated files are stale; run 'make manifests generate'" && exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Test (envtest)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "::error::Go module files are not tidy; run 'go mod tidy' and commit the result" && exit 1)
          make test

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Helm lint + template
        run: |
          helm lint charts/podhandoff
          helm template smoke charts/podhandoff > /dev/null
      - name: Sentinel chart command matches binary
        run: make sentinel-chart-check
      - name: Chart metadata tracks appVersion
        run: make chart-check
      - name: GitOps field-ownership contract
        run: make gitops-check

  license-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Verify licensing baseline
        run: make license-check
      - name: Generate CycloneDX SBOM
        run: make sbom SBOM_OUT=artifacts/podhandoff.cdx.json
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: podhandoff-cyclonedx-sbom
          path: artifacts/podhandoff.cdx.json
          if-no-files-found: error
